services:
  postgres:
    image: postgres:16-alpine
    container_name: contas-api-postgres
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-contas} -d ${DB_NAME:-contas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${DB_NAME:-contas}
      POSTGRES_USER: ${DB_USER:-contas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-contas}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
volumes:
  postgres-data:
    name: contas-api-postgres-data
      