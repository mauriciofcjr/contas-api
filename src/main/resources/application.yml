spring:
  application:
    name: contas-api
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enable: true 
    baseline-on-migrate: true
server:
  port: 8080
  error:
    include-message: always
springdoc:
  swagger-ui:
    path: /docs.html
management:
  endpoints:
    web:
      exposure:
        include: health,info